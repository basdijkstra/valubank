name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 22, 23, 24, 25, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover services and ports
        run: |
          SERVICES=$(for d in services/*/; do
            [ -f "${d}pom.xml" ] && basename "$d"
          done | sort | tr '\n' ' ')
          echo "SERVICES=$SERVICES" >> "$GITHUB_ENV"

          PORTS=""
          for svc in $SERVICES; do
            port=$(grep -m1 'port:' "services/$svc/src/main/resources/application.yml" | grep -oE '[0-9]+')
            if [ -n "$port" ]; then
              PORTS="$PORTS $port"
            else
              echo "::warning::No port found for $svc, skipping liveness check for it"
            fi
          done
          # Frontend isn't a Maven service, so it's not auto-discovered - added explicitly.
          PORTS="$PORTS 5173"
          echo "PORTS=$PORTS" >> "$GITHUB_ENV"

          echo "Discovered services: $SERVICES"
          echo "Discovered ports:    $PORTS"

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Compile all services
        run: |
          for svc in $SERVICES; do
            echo "::group::Compile $svc"
            (cd "services/$svc" && mvn -B -ntp clean compile)
            echo "::endgroup::"
          done

      - name: Start all services
        run: |
          chmod +x scripts/start-all.sh
          mkdir -p logs
          nohup ./scripts/start-all.sh > logs/start-all.log 2>&1 &
          disown

      - name: Wait for services to be live
        id: wait-for-services
        run: |
          for port in $PORTS; do
            echo "Waiting for localhost:$port..."
            timeout 120 bash -c "until curl -s -o /dev/null http://localhost:$port; do sleep 2; done" \
              || { echo "::error::Timed out waiting for port $port"; cat logs/*.log 2>/dev/null; exit 1; }
            echo "localhost:$port is up"
          done

      - name: Run backend tests (mvn clean test)
        run: |
          for svc in $SERVICES; do
            echo "::group::Test $svc"
            (cd "services/$svc" && mvn -B -ntp clean test)
            echo "::endgroup::"
          done

      # Runs even when backend tests failed, so every build has E2E results to analyze.
      # Skipped only when the services never came up.
      - name: Run E2E tests (Playwright)
        if: ${{ !cancelled() && steps.wait-for-services.outcome == 'success' }}
        working-directory: e2e
        run: npx playwright test

      # One artifact per JDK version, so analyze-e2e-failures can compare them.
      - name: Upload E2E results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-jdk${{ matrix.java-version }}
          path: |
            e2e/results/
            e2e/test-results/
            e2e/playwright-report/
            logs/
          if-no-files-found: ignore

  # Analyzes failed and flaky Playwright tests with Claude, across all JDK versions at once.
  # Advisory only: it never changes the result of build-and-test.
  analyze-e2e-failures:
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Empty for pull requests from forks, which don't receive secrets.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download E2E results of all JDK versions
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-jdk*
          path: artifacts

      - name: Collect failed and flaky tests
        id: collect
        run: node .github/scripts/collect-e2e-failures.mjs artifacts failure-analysis

      - name: Install Claude Code
        if: ${{ steps.collect.outputs.needs_analysis == 'true' && env.HAS_ANTHROPIC_KEY == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      # Read-only: no Bash, no web access, no file writes. The report is rendered from the
      # structured output by the next step.
      - name: Analyze failures with Claude
        id: analyze
        if: ${{ steps.collect.outputs.needs_analysis == 'true' && env.HAS_ANTHROPIC_KEY == 'true' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/prompts/analyze-e2e-failures.md)"             --model claude-opus-5-5             --restricted             --tools "Read,Grep,Glob"             --json-schema "$(cat .github/prompts/e2e-findings.schema.json)"             --output-format json             --max-budget-usd 5             > failure-analysis/claude-output.json

      - name: Write analysis report
        if: ${{ steps.collect.outputs.needs_analysis == 'true' }}
        env:
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
        run: node .github/scripts/render-e2e-analysis.mjs failure-analysis

      - name: Publish analysis report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-analysis
          path: failure-analysis/
          retention-days: 90
          if-no-files-found: ignore
