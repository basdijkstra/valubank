name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 22, 23, 24, 25, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover services and ports
        run: |
          SERVICES=$(for d in services/*/; do
            [ -f "${d}pom.xml" ] && basename "$d"
          done | sort | tr '\n' ' ')
          echo "SERVICES=$SERVICES" >> "$GITHUB_ENV"

          PORTS=""
          for svc in $SERVICES; do
            port=$(grep -m1 'port:' "services/$svc/src/main/resources/application.yml" | grep -oE '[0-9]+')
            if [ -n "$port" ]; then
              PORTS="$PORTS $port"
            else
              echo "::warning::No port found for $svc, skipping liveness check for it"
            fi
          done
          # Frontend isn't a Maven service, so it's not auto-discovered - added explicitly.
          PORTS="$PORTS 5173"
          echo "PORTS=$PORTS" >> "$GITHUB_ENV"

          echo "Discovered services: $SERVICES"
          echo "Discovered ports:    $PORTS"

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Compile all services
        run: |
          for svc in $SERVICES; do
            echo "::group::Compile $svc"
            (cd "services/$svc" && mvn -B -ntp clean compile)
            echo "::endgroup::"
          done

      - name: Start all services
        run: |
          chmod +x scripts/start-all.sh
          mkdir -p logs
          nohup ./scripts/start-all.sh > logs/start-all.log 2>&1 &
          disown

      - name: Wait for services to be live
        id: wait-for-services
        run: |
          for port in $PORTS; do
            echo "Waiting for localhost:$port..."
            timeout 120 bash -c "until curl -s -o /dev/null http://localhost:$port; do sleep 2; done" \
              || { echo "::error::Timed out waiting for port $port"; cat logs/*.log 2>/dev/null; exit 1; }
            echo "localhost:$port is up"
          done

      - name: Run backend tests (mvn clean test)
        run: |
          for svc in $SERVICES; do
            echo "::group::Test $svc"
            (cd "services/$svc" && mvn -B -ntp clean test)
            echo "::endgroup::"
          done

      # Runs even when backend tests failed, so every build has E2E results to analyze.
      # Skipped only when the services never came up.
      - name: Run E2E tests (Playwright)
        if: ${{ !cancelled() && steps.wait-for-services.outcome == 'success' }}
        working-directory: e2e
        run: npx playwright test

      # One artifact per JDK version, so analyze-e2e-failures can compare them. These are
      # raw results (traces contain network data), so they are kept for a short time only.
      - name: Upload E2E results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-jdk${{ matrix.java-version }}
          path: |
            e2e/results/
            e2e/test-results/
            e2e/playwright-report/
            logs/
          retention-days: 14
          if-no-files-found: ignore

  # Analyzes failed and flaky Playwright tests with Claude, across all JDK versions at once.
  # Advisory only: it never changes the result of build-and-test.
  #
  # What the LLM may see is controlled step by step (docs/llm-data-policy.md):
  # an allowlisted, pseudonymized workspace outside the checkout, a secret scan that must
  # pass before anything is sent, and a second scan before the report is published.
  analyze-e2e-failures:
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Empty for pull requests from forks, which don't receive secrets.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      CLAUDE_CODE_VERSION: 2.1.291
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      # No GITHUB_TOKEN left behind in .git/config.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The redaction is a safeguard, so it is tested like any other code, every run.
      - name: Test the redaction rules
        run: node --test .github/scripts/redact.test.mjs

      - name: Download E2E results of all JDK versions
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-jdk*
          path: artifacts

      # Raw, unredacted: stays on the runner, never sent or published.
      - name: Collect failed and flaky tests
        id: collect
        run: node .github/scripts/collect-e2e-failures.mjs artifacts analysis-input

      - name: Prepare the analysis workspace (allowlist and redaction)
        id: prepare
        if: ${{ steps.collect.outputs.needs_analysis == 'true' }}
        run: node .github/scripts/prepare-analysis-workspace.mjs analysis-input/failures.json . "$RUNNER_TEMP/analysis-workspace" failure-analysis

      # Pinned and checksum-verified: the scanner is part of the safeguard.
      - name: Install the secret scanner
        if: ${{ steps.collect.outputs.needs_analysis == 'true' }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Proves the scanner works before we rely on it: a planted fake secret must be found.
      - name: Check that the secret scanner finds a planted secret
        id: canary
        if: ${{ steps.collect.outputs.needs_analysis == 'true' }}
        run: |
          gitleaks version
          canary_dir=$(mktemp -d)
          # Random and never valid, created at runtime so the repository contains no secret.
          echo "aws_access_key_id = AKIA$(head -c 400 /dev/urandom | tr -dc 'A-Z2-7' | head -c 16)" > "$canary_dir/canary.txt"
          if bash .github/scripts/scan-secrets.sh "$canary_dir" "$RUNNER_TEMP/canary-report.json" > /dev/null; then
            echo "::error::The secret scanner did not find the planted canary. Nothing will be sent to the LLM."
            exit 1
          fi
          echo "Canary found: the secret scanner works."

      # Fail closed: any finding means nothing is sent to the LLM, and the job fails.
      - name: Scan the analysis input for secrets
        id: scan-input
        if: ${{ steps.collect.outputs.needs_analysis == 'true' }}
        run: |
          mkdir -p secret-scans
          bash .github/scripts/scan-secrets.sh "$RUNNER_TEMP/analysis-workspace" secret-scans/secret-scan-input.json

      # Pinned, so a CLI release can't change the analysis between builds. The version
      # check shows which claude binary the next step actually runs.
      - name: Install Claude Code
        if: ${{ steps.scan-input.outcome == 'success' && env.HAS_ANTHROPIC_KEY == 'true' }}
        run: |
          npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
          which -a claude
          claude --version

      # Runs inside the analysis workspace, so it can only read what was prepared there.
      # Read-only: --tools makes only Read, Grep and Glob available (no Bash, no web access,
      # no file writes), and the settings add deny rules as a second line of defence.
      - name: Analyze failures with Claude
        id: analyze
        if: ${{ steps.scan-input.outcome == 'success' && env.HAS_ANTHROPIC_KEY == 'true' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/analysis-workspace
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat "$GITHUB_WORKSPACE/.github/prompts/analyze-e2e-failures.md")" \
            --model claude-opus-5-5 \
            --tools "Read,Grep,Glob" \
            --settings "$GITHUB_WORKSPACE/.github/claude/analysis-settings.json" \
            --json-schema "$(cat "$GITHUB_WORKSPACE/.github/prompts/e2e-findings.schema.json")" \
            --output-format json \
            --max-budget-usd 5 \
            > "$GITHUB_WORKSPACE/failure-analysis/claude-output.json"

      - name: Write analysis report
        id: render
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
          INPUT_SCAN_OUTCOME: ${{ steps.scan-input.outcome }}
        run: node .github/scripts/render-e2e-analysis.mjs failure-analysis

      # The output is data too: the model could have copied something it should not have.
      - name: Scan the report for secrets
        id: scan-output
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          mkdir -p secret-scans
          bash .github/scripts/scan-secrets.sh failure-analysis secret-scans/secret-scan-output.json

      - name: Add report to job summary
        if: ${{ !cancelled() && steps.scan-output.outcome == 'success' }}
        run: cat failure-analysis/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish analysis report
        if: ${{ !cancelled() && steps.scan-output.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-analysis
          path: failure-analysis/
          retention-days: 90

      # Rule ids and locations only (the scanner redacts the secrets themselves).
      - name: Publish secret scan results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-secret-scans
          path: secret-scans/
          retention-days: 90
          if-no-files-found: ignore
