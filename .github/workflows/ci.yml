name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 22, 23, 24, 25, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover services and ports
        run: |
          SERVICES=$(for d in services/*/; do
            [ -f "${d}pom.xml" ] && basename "$d"
          done | sort | tr '\n' ' ')
          echo "SERVICES=$SERVICES" >> "$GITHUB_ENV"

          PORTS=""
          for svc in $SERVICES; do
            port=$(grep -m1 'port:' "services/$svc/src/main/resources/application.yml" | grep -oE '[0-9]+')
            if [ -n "$port" ]; then
              PORTS="$PORTS $port"
            else
              echo "::warning::No port found for $svc, skipping liveness check for it"
            fi
          done
          # Frontend isn't a Maven service, so it's not auto-discovered - added explicitly.
          PORTS="$PORTS 5173"
          echo "PORTS=$PORTS" >> "$GITHUB_ENV"

          echo "Discovered services: $SERVICES"
          echo "Discovered ports:    $PORTS"

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Compile all services
        run: |
          for svc in $SERVICES; do
            echo "::group::Compile $svc"
            (cd "services/$svc" && mvn -B -ntp clean compile)
            echo "::endgroup::"
          done

      - name: Start all services
        run: |
          chmod +x scripts/start-all.sh
          mkdir -p logs
          nohup ./scripts/start-all.sh > logs/start-all.log 2>&1 &
          disown

      - name: Wait for services to be live
        run: |
          for port in $PORTS; do
            echo "Waiting for localhost:$port..."
            timeout 120 bash -c "until curl -s -o /dev/null http://localhost:$port; do sleep 2; done" \
              || { echo "::error::Timed out waiting for port $port"; cat logs/*.log 2>/dev/null; exit 1; }
            echo "localhost:$port is up"
          done

      - name: Run backend tests (mvn clean test)
        run: |
          for svc in $SERVICES; do
            echo "::group::Test $svc"
            (cd "services/$svc" && mvn -B -ntp clean test)
            echo "::endgroup::"
          done

      - name: Run E2E tests (Playwright)
        working-directory: e2e
        run: npx playwright test
