server:
  port: 8084

spring:
  application:
    name: interest-rate-service

  datasource:
    url: jdbc:h2:mem:interestrateconfigdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
