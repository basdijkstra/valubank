server:
  port: 8082

spring:
  application:
    name: payments-service
  datasource:
    url: jdbc:h2:mem:paymentsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Downstream services this Payments Service depends on at runtime.
# There is intentionally no shared contract/client library with these services -
# just plain point-to-point HTTP calls, as an independently-owned team would build.
valubank:
  accounts-service:
    url: http://localhost:8081
  fraud-service:
    url: http://localhost:8083
