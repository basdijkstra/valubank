server:
  port: 8086

spring:
  application:
    name: assistant-service

# Downstream services this Assistant Service calls on the model's behalf.
# Same "no shared contract" style as the rest of ValuBank - plain HTTP calls.
valubank:
  accounts-service:
    url: http://localhost:8081
  payments-service:
    url: http://localhost:8082
  anthropic:
    api-key: ${VALUBANK_API_KEY:}
    model: claude-haiku-4-5-20251001
