server:
  port: 8081

spring:
  application:
    name: accounts-service
  datasource:
    url: jdbc:h2:mem:accountsdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

valubank:
  interest-rate-service:
    url: http://localhost:8084
